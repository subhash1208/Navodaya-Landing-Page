# Toolchain for this project. Pinned exactly so local, CI, and agent sessions
# resolve identical binaries.
[tools]
node = "26.5.0"
# 11.12.0 was withdrawn: its `@pnpm/exe` build shipped 11 metadata files and no
# binary (16 KB unpacked, against 18.7 MB for 11.27.1), so every corepack-based
# install fails. It runs fine when mise installs it, which is why this went
# unnoticed locally while Vercel could not build master at all.
pnpm = "11.27.1"

# `uv` was pinned here only to launch the `sequential-thinking` MCP server via
# `uvx`. That server no longer needs any Python toolchain — but note it is NOT
# launched by `pnpm dlx` either: every fetch-on-demand launcher dies at startup
# with ERR_MODULE_NOT_FOUND ('Cannot find package zod'), an upstream bug where
# both MCP servers import zod without declaring it. They run from a standalone
# pnpm project outside every repo, launched directly with `node`. Full forensics
# and the exact paths are in `.vscode/mcp.json` and `.github/CONTROL-PLANE-NOTES.md`.
